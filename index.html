<title>Mimo · Produtividade e Organização</title>
<style>
:root{--bg:#fbf4ef;--card:#fff;--pink:#fde4ea;--ac:#e8457a;--ac2:#fbd0dc;--tx:#3b2a26;--mu:#8a766f;--ln:#efd9d2;--ac3:#ff8a5b;--ok:#2f9e6b;--wa:#e0a030;--bl:#cfe3ff;--pk:#fbd0dc;--li:#e3d6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c1a;--card:#2f2522;--pink:#40292f;--ac:#f0628f;--ac2:#5a3340;--tx:#f6e9e4;--mu:#b9a49c;--ln:#4a3a35;--bl:#2d4666;--pk:#6a3345;--li:#4a3b73;--ac3:#ff9a6b}}
:root[data-theme="dark"]{--bg:#241c1a;--card:#2f2522;--pink:#40292f;--ac:#f0628f;--ac2:#5a3340;--tx:#f6e9e4;--mu:#b9a49c;--ln:#4a3a35;--bl:#2d4666;--pk:#6a3345;--li:#4a3b73;--ac3:#ff9a6b}
:root[data-gender="m"]{--bg:#f2f4f7;--card:#fff;--pink:#e7ecf3;--ac:#2f6fdb;--ac2:#cfe0fa;--tx:#1f2933;--mu:#667383;--ln:#dbe1e8;--pk:#d3efe6;--ac3:#17b6c9}
@media(prefers-color-scheme:dark){:root[data-gender="m"]:not([data-theme="light"]){--bg:#13171c;--card:#1c2229;--pink:#252d37;--ac:#5b9bf0;--ac2:#2b405c;--tx:#e8edf2;--mu:#98a5b3;--ln:#2d3844;--pk:#1f4a3e;--ac3:#35c9d8}}
:root[data-gender="m"][data-theme="dark"]{--bg:#13171c;--card:#1c2229;--pink:#252d37;--ac:#5b9bf0;--ac2:#2b405c;--tx:#e8edf2;--mu:#98a5b3;--ln:#2d3844;--pk:#1f4a3e;--ac3:#35c9d8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}body{margin:0;height:100%;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{overflow-x:hidden;touch-action:manipulation;overflow-wrap:break-word}#app{display:flex;height:100%;width:100%;overflow:hidden}
#side{width:230px;background:var(--card);border-right:1px solid var(--ln);padding:14px 10px;overflow:auto;flex:none;transition:margin .2s}
#side.off{margin-left:-231px}
#side h1{font-size:17px;margin:4px 8px 12px}
.nv{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:12px;font:inherit;cursor:pointer;text-align:left;min-height:42px}
.nv:hover{background:var(--pink)}.nv.on{background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;font-weight:600}
#main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 80px}#main>*:not(.rv){max-width:920px;margin-left:auto;margin-right:auto}
#top{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
#top h2{margin:0;font-size:22px;flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:0 0 12px;box-shadow:0 10px 26px -16px color-mix(in srgb,var(--ac) 55%,transparent)}
.card h3{margin:0 0 8px;font-size:16px}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 13px;min-height:40px}
.pri{background:linear-gradient(135deg,var(--ac),var(--ac3));color:#fff;border-color:transparent;font-weight:600}.sm{padding:4px 9px;min-height:32px;font-size:13px}
.dg{color:#c0344d}.ghost{border:0;background:none;color:var(--mu);text-decoration:underline;font-size:12px;min-height:30px}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac);flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--pink);color:var(--tx)}
.mu{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:22px 10px;border:1px dashed var(--ln);border-radius:14px}
.tabs{display:flex;gap:4px;background:var(--pink);padding:4px;border-radius:14px;margin-bottom:12px;overflow:auto}
.tabs button{border:0;background:none;flex:1;white-space:nowrap}.tabs button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0002}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.it .b{flex:1;min-width:0}.it.d .t{text-decoration:line-through;color:var(--mu)}
.it[class*=k-]{border-radius:10px;margin-bottom:3px;border-bottom:0}.it.k-tarefa{background:color-mix(in srgb,var(--bl) 45%,transparent)}.it.k-habito{background:color-mix(in srgb,var(--pk) 45%,transparent)}.it.k-compromisso{background:color-mix(in srgb,var(--li) 45%,transparent)}
.p1{border-left:4px solid var(--ac)}.p2{border-left:4px solid var(--wa)}.p3{border-left:4px solid var(--ln)}
details{position:relative}summary{list-style:none;cursor:pointer;padding:2px 8px;border-radius:8px;font-size:18px}summary::-webkit-details-marker{display:none}
details .mn{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;z-index:9;min-width:170px;box-shadow:0 6px 20px #0003}
.mn button{display:block;width:100%;border:0;text-align:left}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.wk button{display:flex;flex-direction:column;align-items:center;padding:8px 2px}.wk button.on{background:var(--tx);color:var(--bg)}.wk .tdy{outline:2px solid var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{min-width:0;min-height:54px;border:1px solid var(--ln);border-radius:10px;padding:3px;font-size:12px;background:var(--card);overflow:hidden}
.cal .h{min-height:0;border:0;background:none;text-align:center;color:var(--mu)}.cal>div.cl{cursor:pointer}.cal .tdy{outline:2px solid var(--ac)}
.hr{display:flex;gap:8px;border-top:1px solid var(--ln);min-height:44px}.hr>b{width:48px;color:var(--mu);font-weight:400;font-size:12px;padding-top:4px}
.ev{background:var(--ac2);border-radius:8px;padding:2px 8px;margin:2px 0;font-size:13px;cursor:pointer}.ev.t-tarefa{background:var(--bl)}.ev.t-habito{background:var(--pk)}.ev.t-compromisso{background:var(--li)}.cup{background:none;border:0;font-size:22px;padding:0 2px;min-height:0;opacity:.3;filter:grayscale(1)}.cup.on{opacity:1;filter:none}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ac);margin-right:3px;vertical-align:middle}.dot.on{background:var(--ac)}.lg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;margin-right:6px}

 const d=ym+'-'+pad(dm),k=t.id+'@'+ym;o.push({t,d,val,lab,k,card:isCard(accOf(t.acc)),paid:k in S.paid?S.paid[k]:(t.type=='unico'&&d<=TD)})});return o.sort((a,b)=>a.d.localeCompare(b.d))}

async function nfAsk(){if(typeof Notification=='undefined')return toast('Este navegador não oferece notificações.');const p=await Notification.requestPermission();toast(p=='granted'?'Avisos ativados neste aparelho ✓':'Permissão não concedida. Libere nas configurações do navegador.');render()}
function notifCfg(){const n=nf(),perm=typeof Notification!='undefined'?Notification.permission:'unsupported',sw=(k,l,x)=>`<label class="row" style="margin:6px 0;flex-wrap:nowrap"><input type="checkbox" data-c="nf" data-k="${k}" ${n[k]?'checked':''}><span class="sp">${l}</span>${x||''}</label>`,tm=k=>`<input type="time" data-c="nft" data-k="${k}" value="${E(n[k])}" style="width:auto" aria-label="Horário">`,sel=(k,L,u)=>`<select data-c="nfn" data-k="${k}" style="width:auto" aria-label="${u}">${L.map(v=>`<option value="${v}" ${+n[k]==v?'selected':''}>${v} ${u}</option>`).join('')}</select>`;
const st=isOff()?(n.push?`<p>✅ <b>Push ativo neste aparelho.</b> Os avisos chegam mesmo com o app fechado.</p><button class="ghost" data-a="pushoff">Desativar push neste aparelho</button> <button class="ghost" data-a="pushtest">Enviar aviso de teste</button>`:`<p class="mu">Receba os avisos mesmo com o app fechado.</p><button class="pri" data-a="pushon">Ativar push neste aparelho</button><p class="mu" style="font-size:12px">No iPhone: abra o Mimo pelo Safari, toque em Compartilhar › “Adicionar à Tela de Início” e ative o push pelo app instalado (iOS 16.4 ou mais novo).</p>`):`<p class="mu">Aqui na versão de teste os avisos aparecem enquanto o app está aberto. O push com o app fechado funciona no site oficial (com login).</p>${perm=='granted'?'<p>✅ Avisos liberados neste navegador.</p>':`<button class="pri" data-a="nfask">Permitir avisos neste navegador</button>`}`;
return`<div class="card"><h3 style="margin-top:0">🔔 Notificações</h3>${sw('on','Ligar notificações e lembretes')}${st}</div><div class="card"><h3 style="margin-top:0">O que avisar</h3>${sw('appt','Compromissos e consultas')}<div class="row" style="margin:0 0 6px 28px"><span class="mu">Itens com horário avisam</span>${sel('lead',[0,5,10,15,30,60],'min antes')}</div>${sw('meds','Horário dos remédios')}${sw('bills','Contas e faturas a vencer',sel('billd',[0,1,2,3],'dia(s) antes'))}${sw('bd','Aniversários')}${sw('open','Lembrete para abrir o app',tm('openAt'))}${sw('eod','Pop-up do fim do dia',tm('eodAt'))}<p class="mu" style="font-size:12px">O pop-up do fim do dia pergunta o humor, a gratidão e mostra os gastos e ganhos de hoje.</p><button class="ghost" data-a="eodtest">Ver o pop-up agora</button></div>`}
document.addEventListener('change',e=>{const t=e.target,c=t.dataset&&t.dataset.c;if(c=='nf')nfSet(t.dataset.k,!!t.checked);else if(c=='nft')nfSet(t.dataset.k,t.value||NFD[t.dataset.k]);else if(c=='nfn')nfSet(t.dataset.k,+t.value)});
/* ---- fim do dia ---- */
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
function eodShow(force){const g=S.grat[TD]||{g:['','',''],p:''},mo=S.mood[TD],oc=txOcc(TD.slice(0,7)).filter(o=>o.d==TD),ins=oc.filter(o=>o.t.kind=='in'&&o.paid),outs=oc.filter(o=>o.t.kind=='out'&&(o.paid||o.card)),pend=oc.filter(o=>o.t.kind=='out'&&!o.paid&&!o.card),L=onDay(TD).filter(i=>!i.hideHome),dn=L.filter(i=>i.done&&i.done[TD]).length;U.eodE=mo&&mo.e!=null?mo.e:null;U.eodSnooze=Date.now()+30*6e4;
modal(`<h3 style="margin-top:0">🌙 Como foi o seu dia?</h3><div class="row" style="justify-content:center;gap:6px">${EMO.map((e,i)=>`<button class="emo eodm ${U.eodE===i?'on':''}" style="font-size:30px" data-a="eodm" data-e="${i}" aria-label="Humor ${i+1} de 5">${e}</button>`).join('')}</div><h4 style="margin:12px 0 4px">🙏 Pelo que você é grato(a) hoje?</h4>${[0,1,2].map(i=>`<input id="eg${i}" value="${E((g.g||[])[i]||'')}" placeholder="${i+1}." aria-label="Gratidão ${i+1}" style="margin-bottom:4px">`).join('')}<h4 style="margin:12px 0 4px">🎯 Prioridade de amanhã</h4><input id="egp" value="${E(g.p||'')}" placeholder="Qual é a prioridade número 1?" aria-label="Prioridade de amanhã">
<div class="card" style="margin:12px 0 0"><b>💰 Seu dinheiro hoje</b><div class="row" style="margin-top:4px"><span class="sp">⬆️ Ganhos</span><b>${money(sum(ins))}</b></div>${ins.map(o=>`<div class="mu" style="font-size:12px">${E(o.t.desc||'Entrada')} · ${money(o.val)}</div>`).join('')}<div class="row"><span class="sp">⬇️ Gastos</span><b>${money(sum(outs))}</b></div>${outs.map(o=>`<div class="mu" style="font-size:12px">${E(o.t.desc||'Gasto')} · ${money(o.val)}</div>`).join('')}${pend.length?`<div class="mu" style="font-size:12px;margin-top:4px">A pagar hoje: ${pend.map(o=>E(o.t.desc||'Conta')+' '+money(o.val)).join(', ')}</div>`:''}${!ins.length&&!outs.length?'<div class="mu" style="font-size:12px">Nada lançado hoje. Você pode lançar no Financeiro.</div>':''}</div><p class="mu" style="margin:8px 0">✅ ${dn} de ${L.length} itens concluídos · ${stars(starsFor(TD))} ${starsFor(TD)} estrela(s) até agora</p>
<div class="row"><button class="pri sp" data-a="eodsave">Salvar o dia</button><button class="ghost" data-a="eodlater">Agora não</button></div><p style="text-align:center;margin:8px 0 0"><button class="ghost" style="font-size:12px" data-a="eodskip">Não mostrar mais hoje</button></p>`)}
function eodCheck(){const n=nf();if(!n.on||!n.eod||!S.welcomed||S.eodDay==TD)return;if(U.eodSnooze&&Date.now()<U.eodSnooze)return;if(nowHM()<n.eodAt)return;const m=$('#mod');if(m&&m.classList.contains('on'))return;if(!ready())return;eodShow()}
Object.assign(A,{eodm(e){U.eodE=+e.dataset.e;document.querySelectorAll('.eodm').forEach(b=>b.classList.toggle('on',+b.dataset.e===U.eodE))},eodsave(){const g=[0,1,2].map(i=>(($('#eg'+i)||{}).value||'').trim()),p=(($('#egp')||{}).value||'').trim();if(U.eodE!=null)S.mood[TD]={e:U.eodE,n:(S.mood[TD]||{}).n||''};if(g.some(Boolean)||p)S.grat[TD]={g,p};S.eodDay=TD;save();close();toast('Dia registrado 🌙 '+stars(starsFor(TD))+' '+starsFor(TD)+' estrela(s)');render()},eodlater(){U.eodSnooze=Date.now()+30*6e4;close()},eodskip(){S.eodDay=TD;save();close()},eodtest(){eodShow(true)},nfask(){nfAsk()}});
/* ---- push (site oficial) ---- */
const u8=b=>{const p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))};
let _pushH='',_pushT=null,_pushEns=false;
async function pushReg(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;return reg}
async function pushSub(reg){const r=await fetch(SB_URL+'/functions/v1/send-push?pub=1'),j=await r.json();if(!j.key)throw new Error('sem chave');let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(j.key)});const o=s.toJSON();const{error}=await sb.from('push_subs').upsert({user_id:UID,endpoint:o.endpoint,p256dh:o.keys.p256dh,auth:o.keys.auth,ua:navigator.userAgent.slice(0,150)},{onConflict:'endpoint'});if(error)throw error;return s}
async function pushEnable(){if(!isOff())return;if(!('serviceWorker' in navigator)||!('PushManager' in window)||typeof Notification=='undefined')return toast('Este aparelho não oferece push. No iPhone, instale o app na Tela de Início.');try{const p=await Notification.requestPermission();if(p!='granted')return toast('Permissão não concedida. Libere as notificações nas configurações do navegador.');const reg=await pushReg();await pushSub(reg);S.notif=Object.assign({},S.notif||{},{push:true,on:true});save();await pushSync(true);toast('Push ativado ✓');render()}catch(x){toast('Não consegui ativar o push agora. Tente de novo.')}}
async function pushOffNow(del){try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();const s=reg&&await reg.pushManager.getSubscription();if(s){const ep=s.endpoint;await s.unsubscribe();if(del&&isOff())await sb.from('push_subs').delete().eq('endpoint',ep)}}}catch(x){}}
async function pushDisable(){await pushOffNow(true);if(isOff())try{await sb.from('push_queue').delete().eq('user_id',UID).eq('sent',false)}catch(x){}S.notif=Object.assign({},S.notif||{},{push:false});_pushH='';save();toast('Push desativado neste aparelho');render()}
async function pushSync(force){if(!pushOn())return;const rows=buildReminders(7).map(r=>({user_id:UID,tag:r.tag,fire_at:new Date(r.at).toISOString(),title:r.title,body:r.body,url:'./#'+r.pg})),h=JSON.stringify(rows.map(r=>r.tag+r.fire_at+r.title+r.body));if(!force&&h==_pushH)return;try{await sb.from('push_queue').delete().eq('user_id',UID).eq('sent',false).gte('fire_at',new Date().toISOString());if(rows.length){const{error}=await sb.from('push_queue').upsert(rows,{onConflict:'user_id,tag',ignoreDuplicates:true});if(error)throw error}_pushH=h}catch(x){}}
function pushSoon(){if(!pushOn())return;clearTimeout(_pushT);_pushT=setTimeout(()=>pushSync(),4000)}
async function pushEnsure(){if(_pushEns||!pushOn()||!LOADED)return;_pushEns=true;try{if(typeof Notification!='undefined'&&Notification.permission=='granted'&&'serviceWorker' in navigator){const reg=await pushReg();await pushSub(reg)}}catch(x){}pushSync()}
async function pushTest(){if(!isOff())return;try{const{error}=await sb.from('push_queue').insert({user_id:UID,tag:'test-'+Date.now(),fire_at:new Date().toISOString(),title:'🌸 Mimo',body:'Tudo certo! Seus avisos estão funcionando.',url:'./#home'});if(error)throw error;toast('Aviso de teste enviado. Chega em até 1 minuto.')}catch(x){toast('Não consegui enviar o teste agora.')}}
Object.assign(A,{pushon(){pushEnable()},pushoff(){pushDisable()},pushtest(){pushTest()}});
if(A.alogout){const _lo=A.alogout;A.alogout=async function(){try{await pushOffNow(true)}catch(x){}return _lo.apply(this,arguments)}}
/* ---- relógio ---- */
function q2tick(){try{if(iso(new Date())!=TD){const m=$('#mod');if(!(m&&m.classList.contains('on')))return location.reload()}if(!_stkI&&ready()){_stkI=true;checkStk()}remTick();eodCheck();pushEnsure()}catch(x){}}
setInterval(q2tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)q2tick()});setTimeout(q2tick,2500);

boot();
