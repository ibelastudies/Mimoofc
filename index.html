<title>Mimo · Produtividade e Organização</title>
<style>
:root{--bg:#fbf4ef;--card:#fff;--pink:#fde4ea;--ac:#e8457a;--ac2:#fbd0dc;--tx:#3b2a26;--mu:#8a766f;--ln:#efd9d2;--ok:#2f9e6b;--wa:#e0a030;--bl:#cfe3ff;--pk:#fbd0dc;--li:#e3d6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c1a;--card:#2f2522;--pink:#40292f;--ac:#f0628f;--ac2:#5a3340;--tx:#f6e9e4;--mu:#b9a49c;--ln:#4a3a35;--bl:#2d4666;--pk:#6a3345;--li:#4a3b73}}
:root[data-theme="dark"]{--bg:#241c1a;--card:#2f2522;--pink:#40292f;--ac:#f0628f;--ac2:#5a3340;--tx:#f6e9e4;--mu:#b9a49c;--ln:#4a3a35;--bl:#2d4666;--pk:#6a3345;--li:#4a3b73}
:root[data-gender="m"]{--bg:#f2f4f7;--card:#fff;--pink:#e7ecf3;--ac:#2f6fdb;--ac2:#cfe0fa;--tx:#1f2933;--mu:#667383;--ln:#dbe1e8;--pk:#d3efe6}
@media(prefers-color-scheme:dark){:root[data-gender="m"]:not([data-theme="light"]){--bg:#13171c;--card:#1c2229;--pink:#252d37;--ac:#5b9bf0;--ac2:#2b405c;--tx:#e8edf2;--mu:#98a5b3;--ln:#2d3844;--pk:#1f4a3e}}
:root[data-gender="m"][data-theme="dark"]{--bg:#13171c;--card:#1c2229;--pink:#252d37;--ac:#5b9bf0;--ac2:#2b405c;--tx:#e8edf2;--mu:#98a5b3;--ln:#2d3844;--pk:#1f4a3e}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}body{margin:0;height:100%;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{overflow-x:hidden;touch-action:manipulation;overflow-wrap:break-word}#app{display:flex;height:100%;width:100%;overflow:hidden}
#side{width:230px;background:var(--card);border-right:1px solid var(--ln);padding:14px 10px;overflow:auto;flex:none;transition:margin .2s}
#side.off{margin-left:-231px}
#side h1{font-size:17px;margin:4px 8px 12px}
.nv{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:12px;font:inherit;cursor:pointer;text-align:left;min-height:42px}
.nv:hover{background:var(--pink)}.nv.on{background:var(--ac);color:#fff;font-weight:600}
#main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:0 18px 80px}#main>*:not(.rv){max-width:920px;margin-left:auto;margin-right:auto}
#top{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
#top h2{margin:0;font-size:22px;flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:16px}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 13px;min-height:40px}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.sm{padding:4px 9px;min-height:32px;font-size:13px}
.dg{color:#c0344d}.ghost{border:0;background:none;color:var(--mu);text-decoration:underline;font-size:12px;min-height:30px}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac);flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--pink);color:var(--tx)}
.mu{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:22px 10px;border:1px dashed var(--ln);border-radius:14px}
.tabs{display:flex;gap:4px;background:var(--pink);padding:4px;border-radius:14px;margin-bottom:12px;overflow:auto}
.tabs button{border:0;background:none;flex:1;white-space:nowrap}.tabs button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px #0002}
.it{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--ln)}.it:last-child{border:0}
.it .b{flex:1;min-width:0}.it.d .t{text-decoration:line-through;color:var(--mu)}
.it[class*=k-]{border-radius:10px;margin-bottom:3px;border-bottom:0}.it.k-tarefa{background:color-mix(in srgb,var(--bl) 45%,transparent)}.it.k-habito{background:color-mix(in srgb,var(--pk) 45%,transparent)}.it.k-compromisso{background:color-mix(in srgb,var(--li) 45%,transparent)}
.p1{border-left:4px solid var(--ac)}.p2{border-left:4px solid var(--wa)}.p3{border-left:4px solid var(--ln)}
details{position:relative}summary{list-style:none;cursor:pointer;padding:2px 8px;border-radius:8px;font-size:18px}summary::-webkit-details-marker{display:none}
details .mn{position:absolute;right:0;top:28px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;z-index:9;min-width:170px;box-shadow:0 6px 20px #0003}
.mn button{display:block;width:100%;border:0;text-align:left}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.wk button{display:flex;flex-direction:column;align-items:center;padding:8px 2px}.wk button.on{background:var(--tx);color:var(--bg)}.wk .tdy{outline:2px solid var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{min-width:0;min-height:54px;border:1px solid var(--ln);border-radius:10px;padding:3px;font-size:12px;background:var(--card);overflow:hidden}
.cal .h{min-height:0;border:0;background:none;text-align:center;color:var(--mu)}.cal>div.cl{cursor:pointer}.cal .tdy{outline:2px solid var(--ac)}
.hr{display:flex;gap:8px;border-top:1px solid var(--ln);min-height:44px}.hr>b{width:48px;color:var(--mu);font-weight:400;font-size:12px;padding-top:4px}
.ev{background:var(--ac2);border-radius:8px;padding:2px 8px;margin:2px 0;font-size:13px;cursor:pointer}.ev.t-tarefa{background:var(--bl)}.ev.t-habito{background:var(--pk)}.ev.t-compromisso{background:var(--li)}.cup{background:none;border:0;font-size:22px;padding:0 2px;min-height:0;opacity:.3;filter:grayscale(1)}.cup.on{opacity:1;filter:none}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ac);margin-right:3px;vertical-align:middle}.dot.on{background:var(--ac)}.lg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;margin-right:6px}
.bar{height:10px;background:var(--pink);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.hg{display:grid;gap:3px}.hc{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid var(--ln);background:var(--bg);padding:0;min-height:0;font-size:10px}.hc.on{background:var(--ok);border-color:var(--ok);color:#fff}.hc.na{opacity:.3}
#auth{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}#auth.on{display:flex}body.lock #app{display:none}
#mod{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}

 if(v.newtag&&!S.tags.includes(v.newtag)){S.tags.push(v.newtag)}if(v.newtag)v.tag=v.newtag;
 const rep={k:v.k};if(v.k=='weekly')rep.days=[0,1,2,3,4,5,6].filter(n=>v['d'+n]);if(v.n)rep.n=+v.n;if(v.until&&v.k!='none')rep.until=v.until;
 let it=id?S.items.find(x=>x.id==id):{id:uid(),done:{},skip:{}};const old=it.steps||[];

const cups=(it,ds)=>{if(!(+it.water>0))return'';const g=Math.round(it.water*4),c=(it.cups||{})[ds]||0;return`<div style="margin:4px 0">${[...Array(g)].map((_,i)=>`<button class="cup ${i<c?'on':''}" data-a="cup" data-id="${it.id}" data-d="${ds}" data-i="${i}" aria-label="Copo ${i+1}">🥛</button>`).join('')}<div class="mu">${c*250} ml de ${Math.round(it.water*1000)} ml</div>${c>=g?'<div style="color:var(--ok);font-weight:600;font-size:13px">🎉 Parabéns, meta concluída!</div>':''}</div>`};

function txOcc(ym){const o=[];S.tx.forEach(t=>{const sm=t.date.slice(0,7),dd=+t.date.slice(8),dm=Math.min(dd,dim(+ym.slice(0,4),+ym.slice(5,7)));let val=+t.val,lab='';
 if(t.type=='unico'){if(ym!=sm)return}else if(t.type=='fixo'){if(ym<sm||(t.until&&ym>t.until))return}else{const i=(+ym.slice(0,4)-+sm.slice(0,4))*12+(+ym.slice(5,7)-+sm.slice(5,7));if(i<0||i>=t.n)return;val=val/t.n;lab=` (${i+1}/${t.n})`}
 const d=ym+'-'+pad(dm),k=t.id+'@'+ym;o.push({t,d,val,lab,k,card:isCard(accOf(t.acc)),paid:k in S.paid?S.paid[k]:(t.type=='unico'&&d<=TD)})});return o.sort((a,b)=>a.d.localeCompare(b.d))}
const sum=a=>a.reduce((s,x)=>s+x.val,0);
const isCard=a=>!!a&&a.kind=='Cartão de crédito',accOf=x=>x?S.accs.find(a=>a.id==x||a.name==x):null;
const catNames=()=>S.cats.map(c=>c.n),catCol=n=>(S.cats.find(c=>c.n==n)||{c:'#b9a49c'}).c,catDot=n=>`<span style="color:${catCol(n)}" aria-hidden="true">●</span> ${E(n)}`;
function fat(c,ym,po){const cl=+c.close||28,du=+c.due||10;let v=0;[addM(ym,-1),ym].forEach(m=>txOcc(m).forEach(o=>{if(o.t.kind!='out')return;if(po&&o.t.type!='parc')return;const a=accOf(o.t.acc);if(!a||a.id!=c.id)return;const cm=+o.d.slice(8)<=cl?m:addM(m,1);if(cm==ym)v+=o.val}));const paid=S.pays.filter(p=>p.card==c.id&&p.ym==ym).reduce((s,p)=>s+ +p.val,0),dym=du>cl?ym:addM(ym,1);return{c,cm:ym,val:v,paid,rest:Math.max(0,v-paid),due:dym+'-'+pad(Math.min(du,dim(+dym.slice(0,4),+dym.slice(5,7))))}}
const fatDue=(c,ym)=>fat(c,(+c.due||10)>(+c.close||28)?ym:addM(ym,-1));
const firstYm=()=>S.tx.reduce((m,t)=>t.date<m?t.date:m,TD).slice(0,7);
function saldo(a){let s=+a.bal0||0;for(let ym=firstYm();ym<=TD.slice(0,7);ym=addM(ym,1))txOcc(ym).forEach(o=>{const ac=accOf(o.t.acc);if(ac&&ac.id==a.id&&!o.card&&o.paid)s+=o.t.kind=='in'?o.val:-o.val});S.pays.forEach(p=>{if(p.acc==a.id)s-=+p.val});S.transfers.forEach(t=>{if(t.from==a.id)s-=+t.val;if(t.to==a.id)s+=+t.val});return s}

const wlx=w=>Array.isArray(w&&w.ex)&&w.ex.length?w.ex.map(x=>{const h=exHist()[x.n],last=h&&h.length?h[h.length-1].y:null;return`<div class="lx" style="display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:14px;margin-bottom:8px;background:var(--bg)"><input type="checkbox" data-c="lxchk" style="width:26px;height:26px" aria-label="Exercício feito: ${E(x.n)}"><div class="sp" data-n="${E(x.n)}" style="min-width:0"><b>${E(x.n)}</b><div class="mu">${E(x.s)} séries × ${E(x.r)} repetições${last!=null?' · última carga: '+fmtN(last):''}</div></div><div style="width:96px;flex:none"><input type="text" inputmode="decimal" value="${E(x.c)}" placeholder="Carga" style="text-align:center" aria-label="Carga de ${E(x.n)}"></div></div>`}).join(''):'<p class="mu">Este treino não tem exercícios cadastrados.</p>';
function wlogForm(date){const W=S.workouts;modal(`<h3 style="font-size:20px">🏋️ Treino de ${br(date)}</h3>${W.length?`<div id="fm"><label for="w_w">Treino que você fez</label><select id="w_w" name="wid" data-c="wsel" style="font-size:17px;padding:12px">${W.map(w=>`<option value="${w.id}">${E(w.name)}</option>`).join('')}</select><input type="hidden" name="date" value="${date}"><div class="row" style="margin-top:14px"><b class="sp">Exercícios</b><span class="mu" id="wlp">0 de ${Array.isArray(W[0].ex)?W[0].ex.length:0} feitos</span><button type="button" class="sm" data-a="lxall">Marcar todos</button></div><div id="wlx" style="margin-top:8px">${wlx(W[0])}</div><label for="w_ob">Observações (opcional)</label><textarea id="w_ob" name="note" rows="2"></textarea></div>`:'<p>Monte um treino primeiro, na aba Treinos.</p>'}<div class="row" style="margin-top:12px"><button data-a="close">Cancelar</button><span class="sp"></span>${W.length?'<button class="pri" data-a="wlsave">Registrar treino</button>':''}</div>`);$('#mb').classList.add('wide')}
function fres(q){q=(q||'').trim().toLowerCase();const use={};S.meals.forEach(m=>{if(m.food)use[m.food]=(use[m.food]||0)+1});let L=S.foods.filter(f=>!q||f.name.toLowerCase().includes(q)).sort((a,b)=>(use[b.id]||0)-(use[a.id]||0)||a.name.localeCompare(b.name));const tot=L.length;L=L.slice(0,6);return(q?'':(S.foods.length?'<div class="mu" style="margin:6px 0 2px">Mais usados</div>':''))+L.map(f=>`<button type="button" style="display:flex;width:100%;text-align:left;margin:3px 0;justify-content:space-between;gap:8px" data-a="fpick" data-id="${f.id}"><span>${E(f.name)}</span><span class="mu">${E(f.qty)} · ${E(f.kcal)} kcal</span></button>`).join('')+(tot>6?`<div class="mu">+${tot-6} alimentos. Digite para filtrar.</div>`:'')+`<button type="button" class="sm" style="margin-top:6px" data-a="fnew">＋ Cadastrar ${q?'“'+E(q)+'” como ':''}novo alimento</button>`}
function fresUpd(q){const e=$('#fres');if(e)e.innerHTML=fres(q)}
const bookHue=n=>[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
function biblio(){const sh=T('bk','Lendo'),B=S.books,cnt=k=>B.filter(b=>b.st==k).length,pg=B.reduce((s,b)=>s+(b.st=='Concluído'?(+b.pages||0):(+b.now||0)),0),L=B.filter(b=>b.st==sh).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
 const card=b=>{const p=b.pages?Math.min(100,(+b.now||0)/b.pages*100):0;return`<div class="card" style="margin:0;padding:0;overflow:hidden"><div style="height:8px;background:hsl(${bookHue(b.name)} 55% 55%)"></div><div style="padding:10px"><b>${E(b.name)}</b><div class="mu">${E(b.author)}</div>${b.st=='Lendo'?`<div class="bar" style="margin:8px 0 2px"><i style="width:${p}%"></i></div><div class="mu" style="font-size:12px">${+b.now||0}/${+b.pages||'?'} págs.${b.start?' · desde '+br(b.start).slice(0,5):''}</div>`:''}${b.st=='Concluído'?`<div class="mu" style="font-size:12px">${b.rate?'★'.repeat(+b.rate)+' · ':''}${+b.pages||'?'} págs.${b.end?' · '+br(b.end):''}</div>`:''}${b.st=='Quero ler'&&b.pages?`<div class="mu" style="font-size:12px">${b.pages} págs.</div>`:''}<div class="row" style="margin-top:8px;gap:4px">${b.st=='Lendo'?`<button class="sm pri" data-a="bpg" data-id="${b.id}">📄 Página</button><button class="sm" data-a="bfin" data-id="${b.id}">✓ Concluir</button>`:b.st=='Quero ler'?`<button class="sm pri" data-a="bstart" data-id="${b.id}">▶ Começar</button>`:`<button class="sm" data-a="bstart" data-id="${b.id}">↺ Reler</button>`}<button class="sm" data-a="cedit" data-k="books" data-id="${b.id}" aria-label="Editar">✎</button><button class="sm dg" data-a="cdel" data-k="books" data-id="${b.id}" aria-label="Apagar">🗑</button></div></div></div>`};
 return`<div class="card"><div class="row"><h3 class="sp" style="margin:0">📖 Minha biblioteca</h3>${addBtn('books','Livro')}</div><p class="mu" style="margin:4px 0 0">${cnt('Lendo')} lendo · ${cnt('Quero ler')} na fila · ${cnt('Concluído')} concluídos · ${fmtN(pg)} páginas lidas</p></div>`+tabs('bk',[['Lendo','📖 Lendo ('+cnt('Lendo')+')'],['Quero ler','🔖 Quero ler ('+cnt('Quero ler')+')'],['Concluído','✅ Concluídos ('+cnt('Concluído')+')']],'Lendo')+(L.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">${L.map(card).join('')}</div>`:empty('Nenhum livro nesta prateleira.'))}
const actRow=i=>{const ds=occurs(i,TD)?TD:i.date,d=!!(i.done&&i.done[ds]);return`<div class="it"><input type="checkbox" data-c="chk" data-id="${i.id}" data-d="${ds}" ${d?'checked':''} aria-label="Concluir ${E(i.title)}"><div class="b ${d?'mu':''}" style="${d?'text-decoration:line-through':''}"><b>${E(i.title)}</b><div class="mu">${i.akind?`<span class="chip">${E(i.akind)}</span> `:''}${br(i.date)}${i.time?' · '+i.time:''}${i.rep&&i.rep.k!='none'?' · 🔁':''}</div></div><button class="sm" data-a="iedit" data-id="${i.id}" aria-label="Editar">✎</button></div>`};
const isDone=i=>!!(i.done&&i.done[occurs(i,TD)?TD:i.date]);
function estPn(){const A=S.items.filter(i=>i.area=='estudos'&&!i.arch).sort((a,b)=>a.date.localeCompare(b.date)),orf=A.filter(i=>!i.subject||!S.studies.some(m=>m.id==i.subject));
 return`<div class="row" style="margin-bottom:10px"><span class="sp mu">Vincule provas, tarefas e trabalhos a cada matéria.</span>${addBtn('studies','Matéria / curso')}</div>`+(S.studies.length?S.studies.map(m=>{const L=A.filter(i=>i.subject==m.id),d=L.filter(isDone).length;return`<div class="card"><div class="row"><h3 class="sp" style="margin:0">📚 ${E(m.name)}</h3><button class="sm" data-a="cedit" data-k="studies" data-id="${m.id}" aria-label="Editar matéria">✎</button><button class="sm dg" data-a="cdel" data-k="studies" data-id="${m.id}" aria-label="Apagar matéria">🗑</button></div><div class="mu">${E(m.goal)} ${m.due?'· prazo '+br(m.due):''}</div><div class="bar" style="margin:6px 0 2px"><i style="width:${Math.min(+m.prog||0,100)}%"></i></div><span class="mu">${+m.prog||0}% do conteúdo · ${d}/${L.length} atividades concluídas</span>${L.map(actRow).join('')}<button class="sm" style="margin-top:6px" data-a="newitem" data-area="estudos" data-tag="Estudos" data-subject="${m.id}">＋ Atividade</button></div>`}).join(''):empty('Cadastre uma matéria e depois vincule as atividades a ela.'))+(orf.length?`<div class="card"><h3>Sem matéria</h3>${orf.map(actRow).join('')}</div>`:'')}
function trbProj(){const A=S.items.filter(i=>i.area=='trabalho'&&!i.arch).sort((a,b)=>a.date.localeCompare(b.date)),orf=A.filter(i=>!i.project||!S.projects.some(p=>p.id==i.project));
 return`<div class="row" style="margin-bottom:10px"><span class="sp mu">Vincule cada demanda a um projeto.</span>${addBtn('projects','Projeto')}</div>`+(S.projects.length?S.projects.map(p=>{const L=A.filter(i=>i.project==p.id),d=L.filter(isDone).length;return`<div class="card"><div class="row"><h3 class="sp" style="margin:0">💼 ${E(p.name)}</h3><span class="chip">${E(p.st)}</span><span class="chip">${E(p.pr)}</span><button class="sm" data-a="cedit" data-k="projects" data-id="${p.id}" aria-label="Editar projeto">✎</button><button class="sm dg" data-a="cdel" data-k="projects" data-id="${p.id}" aria-label="Apagar projeto">🗑</button></div><div class="mu">${p.due?'prazo '+br(p.due)+' · ':''}${E(p.note)}</div><div class="bar" style="margin:6px 0 2px"><i style="width:${L.length?d/L.length*100:0}%"></i></div><span class="mu">${d}/${L.length} demandas concluídas</span>${L.map(actRow).join('')}<button class="sm" style="margin-top:6px" data-a="newitem" data-area="trabalho" data-tag="Trabalho" data-project="${p.id}">＋ Demanda</button></div>`}).join(''):empty('Crie um projeto e vincule suas demandas a ele.'))+(orf.length?`<div class="card"><h3>Demandas sem projeto</h3>${orf.map(actRow).join('')}</div>`:'')}
